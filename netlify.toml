[build]
  command = "node -e \"const fs=require('fs'); fs.mkdirSync('dist',{recursive:true}); ['index.html','styles.css','app.js','proposicoes.json','manifest.json','_headers','_redirects'].forEach(f=>{if(fs.existsSync(f))fs.copyFileSync(f,'dist/'+f);});\""
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "/api/proposicoes"
  to = "/proposicoes.json"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
